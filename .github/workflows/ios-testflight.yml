name: iOS TestFlight Release

on:
  workflow_dispatch:
    inputs:
      upload_to_testflight:
        description: Upload the signed archive to TestFlight
        type: boolean
        default: true
      version_check_only:
        description: Only check the version (no build or upload)
        type: boolean
        default: false

run-name: iOS ${{ inputs.upload_to_testflight && 'Upload' || 'Build only' }} (${{ github.ref_name }})

permissions:
  contents: read

concurrency:
  group: store-release-ios
  cancel-in-progress: false

jobs:
  check_version:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/store-version-check
        with:
          platform: ios
          upload: ${{ inputs.upload_to_testflight }}
          asc_key_id: ${{ secrets.ASC_KEY_ID }}
          asc_issuer_id: ${{ secrets.ASC_ISSUER_ID }}
          asc_key_content: ${{ secrets.ASC_KEY_CONTENT_BASE64 }}

  beta:
    needs: check_version
    if: ${{ !inputs.version_check_only }}
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v7.0.1

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.0.1'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: stable

      - name: Set up Ruby (fastlane/CocoaPods)
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4.10'
          bundler-cache: true
          working-directory: ios

      - name: flutter pub get
        run: flutter pub get

      - name: Check route-link signing setup
        working-directory: ios
        run: |
          ruby -c fastlane/Fastfile
          bundle exec ruby fastlane/tests/route_link_signing_test.rb

      - name: fastlane beta
        working-directory: ios
        env:
          CI: 'true'
          UPLOAD_TO_TESTFLIGHT: ${{ inputs.upload_to_testflight }}
          IOS_DIST_CERT_P12_BASE64: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
          IOS_DIST_CERT_P12_PASSWORD: ${{ secrets.IOS_DIST_CERT_P12_PASSWORD }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_CONTENT_BASE64: ${{ secrets.ASC_KEY_CONTENT_BASE64 }}
          GEOAPIFY_API_KEY: ${{ secrets.GEOAPIFY_API_KEY }}
        run: bundle exec fastlane beta
