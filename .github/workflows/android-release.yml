name: Android Release

on:
  workflow_dispatch:
    inputs:
      upload_to_play:
        description: Upload the signed bundle to Google Play beta
        type: boolean
        default: true
      version_check_only:
        description: Only check the version (no build or upload)
        type: boolean
        default: false

run-name: Android ${{ inputs.upload_to_play && 'Upload' || 'Build only' }} (${{ github.ref_name }})

permissions:
  contents: read

concurrency:
  group: store-release-android
  cancel-in-progress: false

jobs:
  check_version:
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/store-version-check
        id: version
        with:
          platform: android
          upload: ${{ inputs.upload_to_play }}
          google_credentials: ${{ secrets.SERVICE_ACCOUNT_JSON_BASE64 }}

  assembleRelease:
    needs: check_version
    if: ${{ !inputs.version_check_only }}
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v7.0.1
      - name: Set up Java
        uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: stable
      - name: Restore Release Keystore from secrets
        run: |
          echo "${{ secrets.ANDROID_RELEASE_KEYSTORE }}" > release.keystore.asc
          gpg -d --passphrase "${{ secrets.ANDROID_RELEASE_KEYSTORE_PASSWORD }}" --batch release.keystore.asc > android/app/release.keystore
      - name: Install dependencies
        run: flutter pub get
      - name: Create Appbundle
        run: flutter build appbundle --release --dart-define=GEOAPIFY_API_KEY="${GEOAPIFY_API_KEY}"
        env:
          ANDROID_RELEASE_ALIAS: ${{ secrets.ANDROID_RELEASE_KEYSTORE_ALIAS }}
          ANDROID_RELEASE_ALIAS_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEYSTORE_ALIAS_PASSWORD }}
          ANDROID_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEYSTORE_STORE_PASSWORD }}
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
          GEOAPIFY_API_KEY: ${{ secrets.GEOAPIFY_API_KEY }}
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: appbundle
          path: build/app/outputs/bundle/release/app-release.aab
      - name: Load google_play_service_account.json from secrets
        if: ${{ inputs.upload_to_play }}
        run: |
          echo "${{ secrets.SERVICE_ACCOUNT_JSON_BASE64 }}" | base64 --decode > google_play_service_account.json
      - name: Upload to GooglePlay
        uses: r0adkll/upload-google-play@v1.1.5
        if: ${{ inputs.upload_to_play }}
        # workaround, see https://github.com/r0adkll/upload-google-play/issues/129#issuecomment-1325892395
        env:
          OPENSSL_CONF: /dev/null
        with:
          releaseFiles: build/app/outputs/bundle/release/app-release.aab
          serviceAccountJson: google_play_service_account.json
          packageName: com.munichways.app
          tracks: beta
          status: completed
