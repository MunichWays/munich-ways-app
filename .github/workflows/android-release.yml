name: Android Release

on:
  push:
    tags:
      - '*'

jobs:
  assembleRelease:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v7.0.1
      - name: Validate release version
        id: release_version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 -m unittest discover -s tool/tests -p test_android_release_version.py
          python3 tool/android_release_version.py
      - name: Set up Java
        uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: stable
      - name: Restore Release Keystore from secrets
        run: |
          echo "${{ secrets.ANDROID_RELEASE_KEYSTORE }}" > release.keystore.asc
          gpg -d --passphrase "${{ secrets.ANDROID_RELEASE_KEYSTORE_PASSWORD }}" --batch release.keystore.asc > android/app/release.keystore
      - name: Install dependencies
        run: flutter pub get
      - name: Create Appbundle
        run: flutter build appbundle --release --build-name="${RELEASE_BUILD_NAME}" --build-number="${RELEASE_BUILD_NUMBER}" --dart-define=GEOAPIFY_API_KEY="${GEOAPIFY_API_KEY}"
        env:
          RELEASE_BUILD_NAME: ${{ steps.release_version.outputs.build_name }}
          RELEASE_BUILD_NUMBER: ${{ steps.release_version.outputs.build_number }}
          ANDROID_RELEASE_ALIAS: ${{ secrets.ANDROID_RELEASE_KEYSTORE_ALIAS }}
          ANDROID_RELEASE_ALIAS_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEYSTORE_ALIAS_PASSWORD }}
          ANDROID_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEYSTORE_STORE_PASSWORD }}
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
          GEOAPIFY_API_KEY: ${{ secrets.GEOAPIFY_API_KEY }}
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: appbundle
          path: build/app/outputs/bundle/release/app-release.aab
      - name: Create Release
        uses: softprops/action-gh-release@v3.0.3
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            build/app/outputs/apk/release/app-release.apk
            build/app/outputs/bundle/release/app-release.aab
      - name: Load google_play_service_account.json from secrets
        run: |
          echo "${{ secrets.SERVICE_ACCOUNT_JSON_BASE64 }}" | base64 --decode > google_play_service_account.json
      - name: Upload to GooglePlay
        uses: r0adkll/upload-google-play@v1.1.5
        if: startsWith(github.ref, 'refs/tags/')
        # workaround, see https://github.com/r0adkll/upload-google-play/issues/129#issuecomment-1325892395
        env:
          OPENSSL_CONF: /dev/null
        with:
          releaseFiles: build/app/outputs/bundle/release/app-release.aab
          serviceAccountJson: google_play_service_account.json
          packageName: com.munichways.app
          tracks: beta
          status: completed
