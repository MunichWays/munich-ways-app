name: Check store build number
description: Keep pubspec.yaml authoritative and compare uploads with the destination store
inputs:
  platform:
    required: true
    description: android or ios
  upload:
    required: true
    description: Whether this run will upload
  google_credentials:
    default: ''
    description: Base64 Google service account JSON
  asc_key_id:
    default: ''
    description: App Store Connect key ID
  asc_issuer_id:
    default: ''
    description: App Store Connect issuer ID
  asc_key_content:
    default: ''
    description: Base64 App Store Connect private key
outputs:
  version:
    description: Validated pubspec version
    value: ${{ steps.check.outputs.version }}
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v6
      with:
        python-version: '3.13'
        cache: pip
        cache-dependency-path: tool/store-version-requirements.txt
    - name: Install version-check dependencies
      shell: bash
      run: python -m pip install -r tool/store-version-requirements.txt
    - name: Test store version guard
      shell: bash
      run: python -m unittest discover -s tool/tests -p 'test_store_release*.py'
    - name: Check pubspec build against store
      id: check
      shell: bash
      env:
        STORE_PLATFORM: ${{ inputs.platform }}
        UPLOAD_ENABLED: ${{ inputs.upload }}
        SERVICE_ACCOUNT_JSON_BASE64: ${{ inputs.google_credentials }}
        ASC_KEY_ID: ${{ inputs.asc_key_id }}
        ASC_ISSUER_ID: ${{ inputs.asc_issuer_id }}
        ASC_KEY_CONTENT_BASE64: ${{ inputs.asc_key_content }}
      run: python tool/store_release_version.py
