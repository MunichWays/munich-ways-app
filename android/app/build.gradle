plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def keystorePropertiesFile = file('../release_keystore.properties')
def keystoreProperties = new Properties()
if(keystorePropertiesFile.exists()) {
    project.logger.info('Load keystore properties from local file')
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
} else {
    project.logger.info('Load keystore properties from environment')
    try {
        keystoreProperties['storeFile'] = System.getenv('ANDROID_RELEASE_STORE_FILE') ?: 'release.keystore'
        keystoreProperties['storePassword'] = System.getenv('ANDROID_RELEASE_STORE_PASSWORD')
        keystoreProperties['alias'] = System.getenv('ANDROID_RELEASE_ALIAS')
        keystoreProperties['aliasPassword'] = System.getenv('ANDROID_RELEASE_ALIAS_PASSWORD')
    } catch(NullPointerException e) {
        project.logger.error('Failed to load keystore properties from environment.', e)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0'
}

android {
    compileSdkVersion 36
    ndkVersion "28.2.13676358"

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    defaultConfig {
        applicationId "com.munichways.app"
        // flutter_tts requires minSdk >= 24 (maplibre_gl requires >= 23).
        // Math.max keeps the constraint explicit and is immune to Flutter's
        // MinSdkVersionMigration tool (which rewrites bare values 16-23 to flutter.minSdkVersion).
        minSdkVersion Math.max(flutter.minSdkVersion, 24)
        targetSdkVersion 36
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
    }

    def releaseKeystoreFile = file(keystoreProperties['storeFile'] ?: 'release.keystore')
    def hasReleaseSigningCredentials = keystoreProperties['storeFile'] &&
        releaseKeystoreFile.exists() &&
        keystoreProperties['alias'] &&
        keystoreProperties['aliasPassword'] &&
        keystoreProperties['storePassword']

    signingConfigs {
        release {
            keyAlias keystoreProperties['alias']
            keyPassword keystoreProperties['aliasPassword']
            storeFile releaseKeystoreFile
            storePassword keystoreProperties['storePassword']
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'),
                'proguard-rules.pro'
            signingConfig hasReleaseSigningCredentials
                ? signingConfigs.release
                : signingConfigs.debug
        }
    }
    namespace 'com.munichways.munich_ways'
    lint {
        disable 'InvalidPackage'
    }
}

flutter {
    source '../..'
}

dependencies {
}
